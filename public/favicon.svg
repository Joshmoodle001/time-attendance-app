<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7e14ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="8"/>
  <!-- Clock face -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7e14ff" stroke-width="4" opacity="0.4"/>
  <!-- Tick marks -->
  <g stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="96"  x2="256" y2="120"/>
    <line x1="256" y1="392" x2="256" y2="416"/>
    <line x1="96"  y1="256" x2="120"  y2="256"/>
    <line x1="392" y1="256" x2="416" y2="256"/>
    <line x1="143" y1="143" x2="161" y2="161"/>
    <line x1="351" y1="351" x2="369" y2="369"/>
    <line x1="369" y1="143" x2="351" y2="161"/>
    <line x1="161" y1="351" x2="143" y2="369"/>
  </g>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="156" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="316" y2="256" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="url(#accent)"/>
  <!-- Checkmark overlay -->
  <g transform="translate(256, 330)">
    <circle cx="0" cy="0" r="50" fill="#7e14ff"/>
    <polyline points="-22,0 -8,14 24,-18" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
